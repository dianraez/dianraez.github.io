<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portafolio Diana Ramírez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Portafolio de Diana Ramírez — Realizador Cinematográfico y Audiovisual">
  <meta name="theme-color" content="#000000">

  <!-- PWA meta tags so users can "Add to Home Screen" for true fullscreen on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diana Ramírez">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- FAVICONS -->
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: rgba(255, 255, 255, 0.55);
      --control-bg: rgba(18, 18, 18, 0.78);
      --control-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
      overscroll-behavior: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 2;
    }

    #viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    .page-wrapper {
      position: relative;
      box-shadow: var(--shadow);
      transition: opacity 0.25s ease;
    }
    .page-wrapper.swapping { opacity: 0; }
    .page-wrapper canvas { display: block; width: 100%; height: 100%; }

    .annotation-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .pdf-link {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
    }
    @media (hover: hover) {
      .pdf-link:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
      }
    }

    /* Loader */
    #loader {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--fg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    #loader.active { opacity: 1; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* =========================================================
       DESKTOP CONTROLS (centered bottom bar)
       ========================================================= */
    #controls {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translate(-50%, 8px);
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--control-bg);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 6px;
      z-index: 30;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #controls.visible { opacity: 1; transform: translate(-50%, 0); }
    #controls.idle { opacity: 0.2; }
    #controls.idle:hover { opacity: 1; }

    .btn {
      background: transparent;
      border: none;
      color: var(--fg);
      width: 38px; height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, transform 0.18s ease;
      padding: 0;
      text-decoration: none;
    }
    .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
    .btn:active:not(:disabled) { transform: scale(0.92); }
    .btn:disabled { opacity: 0.25; cursor: default; }
    .btn svg { width: 18px; height: 18px; pointer-events: none; }

    .separator {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 4px;
    }

    #page-info {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 0 14px;
      min-width: 64px;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #page-info .current { color: var(--fg); }

    /* Desktop keyboard hint */
    #hint {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 29;
      white-space: nowrap;
    }
    #hint.visible { opacity: 1; }

    /* =========================================================
       MOBILE CONTROLS (side arrows + corner buttons)
       Hidden by default, shown via media query at bottom
       ========================================================= */
    .m-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--fg);
      display: none;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 30;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .m-btn.visible { opacity: 0.85; }
    .m-btn.idle { opacity: 0.25; }
    .m-btn:disabled { opacity: 0.15 !important; pointer-events: none; }
    .m-btn svg { width: 22px; height: 22px; pointer-events: none; }

    /* Side arrows — vertically centered on each edge */
    .m-side {
      top: 50%;
      transform: translateY(-50%);
    }
    #m-prev { left: max(12px, env(safe-area-inset-left)); }
    #m-next { right: max(12px, env(safe-area-inset-right)); }

    /* Corner buttons */
    .m-corner {
      bottom: max(16px, env(safe-area-inset-bottom));
    }
    #m-download { left: max(16px, env(safe-area-inset-left)); }
    #m-fullscreen { right: max(16px, env(safe-area-inset-right)); }

    /* Activate mobile UI on touch devices / small screens */
    @media (pointer: coarse), (max-width: 900px) {
      #controls { display: none !important; }
      #hint { display: none !important; }
      .m-btn { display: flex; }
    }

    /* =========================================================
       ROTATION HINT (portrait phones)
       ========================================================= */
    #rotate-hint {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 40;
      padding: 40px;
      text-align: center;
    }
    @media (pointer: coarse) and (orientation: portrait) and (max-width: 900px) {
      #rotate-hint { display: flex; }
    }
    #rotate-hint .phone-icon {
      width: 64px;
      height: 64px;
      animation: rotate-phone 2.4s ease-in-out infinite;
    }
    @keyframes rotate-phone {
      0%, 30% { transform: rotate(0deg); }
      50%, 80% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }
    #rotate-hint .title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    #rotate-hint .subtitle { font-size: 14px; color: var(--muted); max-width: 280px; line-height: 1.5; }

    /* Error */
    #error {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 24px;
      display: none;
      z-index: 60;
    }
    #error.active { display: block; }
    #error p { margin: 8px 0; color: var(--muted); }
    #error a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--control-border);
      border-radius: 999px;
    }
    #error a:hover { background: rgba(255, 255, 255, 0.08); }
  </style>
</head>

<body>
  <div id="viewer"></div>
  <div id="loader"></div>

  <div id="error">
    <p>No se pudo cargar el portafolio.</p>
    <a href="portafolio-diana-ramirez.pdf" download>Descargar PDF</a>
  </div>

  <div id="hint">← →   navegar   ·   F   pantalla completa</div>

  <div id="rotate-hint" aria-hidden="true">
    <svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2" width="10" height="20" rx="2"/>
      <line x1="11" y1="18" x2="13" y2="18"/>
    </svg>
    <div class="title">Gira tu celular</div>
    <div class="subtitle">El portafolio se ve mejor en horizontal</div>
  </div>

  <!-- Desktop controls -->
  <div id="controls" role="toolbar" aria-label="Controles">
    <button class="btn btn-prev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="page-info"><span class="current">—</span> / —</span>
    <button class="btn btn-next" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <span class="separator"></span>
    <button class="btn btn-fullscreen" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
    <a class="btn btn-download" href="portafolio-diana-ramirez.pdf" download aria-label="Descargar PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </a>
  </div>

  <!-- Mobile controls (side arrows + corner buttons) -->
  <button class="m-btn m-side btn-prev" id="m-prev" aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="m-btn m-side btn-next" id="m-next" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <a class="m-btn m-corner btn-download" id="m-download" href="portafolio-diana-ramirez.pdf" download aria-label="Descargar PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </a>
  <button class="m-btn m-corner btn-fullscreen" id="m-fullscreen" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = 'portafolio-diana-ramirez.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('viewer');
    const loader = document.getElementById('loader');
    const errorEl = document.getElementById('error');
    const controls = document.getElementById('controls');
    const hint = document.getElementById('hint');
    const pageInfo = document.getElementById('page-info');
    const currentEl = pageInfo.querySelector('.current');

    let pdfDoc = null;
    let totalPages = 0;
    let currentPage = 1;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

    let wrapper = null;
    let rendering = false;
    let pending = null;

    // ---------- Fullscreen helpers (with vendor prefixes) ----------
    function getFsElement() {
      return document.fullscreenElement
          || document.webkitFullscreenElement
          || document.mozFullScreenElement
          || document.msFullscreenElement
          || null;
    }
    function requestFs(el) {
      const fn = el.requestFullscreen
              || el.webkitRequestFullscreen
              || el.mozRequestFullScreen
              || el.msRequestFullscreen;
      if (!fn) return Promise.reject(new Error('Fullscreen API no soportada'));
      try {
        const result = fn.call(el);
        return result instanceof Promise ? result : Promise.resolve();
      } catch (e) { return Promise.reject(e); }
    }
    function exitFs() {
      const fn = document.exitFullscreen
              || document.webkitExitFullscreen
              || document.mozCancelFullScreen
              || document.msExitFullscreen;
      if (!fn) return Promise.reject();
      try {
        const result = fn.call(document);
        return result instanceof Promise ? result : Promise.resolve();
      } catch (e) { return Promise.reject(e); }
    }
    function toggleFs() {
      if (getFsElement()) {
        exitFs().catch(() => {});
      } else {
        requestFs(document.documentElement).catch((err) => {
          console.warn('Fullscreen falló:', err?.message || err);
        });
      }
    }

    // Detect if fullscreen is realistically supported (iOS Safari often returns
    // a function that throws — we test by checking the property's existence,
    // and we'll silently no-op on failure)
    const fsSupported = !!(
      document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen ||
      document.documentElement.mozRequestFullScreen ||
      document.documentElement.msRequestFullscreen
    );
    if (!fsSupported) {
      // Hide both fullscreen buttons (desktop + mobile) if truly unsupported
      document.querySelectorAll('.btn-fullscreen').forEach(b => b.style.display = 'none');
    }

    // ---------- Annotation layer (PDF links) ----------
    async function renderAnnotations(page, displayViewport, layerEl) {
      layerEl.innerHTML = '';
      const annotations = await page.getAnnotations();

      for (const ann of annotations) {
        if (ann.subtype !== 'Link') continue;
        const a = document.createElement('a');
        a.className = 'pdf-link';

        if (ann.url) {
          a.href = ann.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        } else if (ann.dest) {
          a.href = '#';
          a.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
              const dest = typeof ann.dest === 'string'
                ? await pdfDoc.getDestination(ann.dest)
                : ann.dest;
              if (dest && dest[0]) {
                const pageIndex = await pdfDoc.getPageIndex(dest[0]);
                goToPage(pageIndex + 1);
              }
            } catch (err) { console.error(err); }
          });
        } else continue;

        const r = pdfjsLib.Util.normalizeRect(
          displayViewport.convertToViewportRectangle(ann.rect)
        );
        a.style.left = (r[0] / displayViewport.width * 100) + '%';
        a.style.top = (r[1] / displayViewport.height * 100) + '%';
        a.style.width = ((r[2] - r[0]) / displayViewport.width * 100) + '%';
        a.style.height = ((r[3] - r[1]) / displayViewport.height * 100) + '%';
        layerEl.appendChild(a);
      }
    }

    // ---------- Render page ----------
    async function renderPage(num) {
      if (rendering) { pending = num; return; }
      rendering = true;
      loader.classList.add('active');
      wrapper.classList.add('swapping');

      try {
        const page = await pdfDoc.getPage(num);
        const canvas = wrapper.querySelector('canvas');
        const annLayer = wrapper.querySelector('.annotation-layer');
        const ctx = canvas.getContext('2d', { alpha: false });

        const base = page.getViewport({ scale: 1 });
        const padding = 20;
        const availW = window.innerWidth - padding * 2;
        const availH = window.innerHeight - padding * 2;
        const scale = Math.min(availW / base.width, availH / base.height);
        const displayW = base.width * scale;
        const displayH = base.height * scale;

        const displayViewport = page.getViewport({ scale });
        const renderViewport = page.getViewport({ scale: scale * DPR });

        canvas.width = renderViewport.width;
        canvas.height = renderViewport.height;
        canvas.style.width = displayW + 'px';
        canvas.style.height = displayH + 'px';
        wrapper.style.width = displayW + 'px';
        wrapper.style.height = displayH + 'px';

        if (wrapper._task) { try { wrapper._task.cancel(); } catch(e){} }
        wrapper._task = page.render({ canvasContext: ctx, viewport: renderViewport });
        await wrapper._task.promise;
        wrapper._task = null;

        await renderAnnotations(page, displayViewport, annLayer);

        await new Promise(r => requestAnimationFrame(r));
        wrapper.classList.remove('swapping');

        currentEl.textContent = num;
        pageInfo.lastChild.textContent = ' / ' + totalPages;

        // Update prev/next disabled state on both desktop and mobile buttons
        document.querySelectorAll('.btn-prev').forEach(b => b.disabled = num <= 1);
        document.querySelectorAll('.btn-next').forEach(b => b.disabled = num >= totalPages);
      } catch (err) {
        if (err?.name !== 'RenderingCancelledException') console.error(err);
      } finally {
        rendering = false;
        loader.classList.remove('active');
        if (pending !== null && pending !== num) {
          const next = pending; pending = null;
          renderPage(next);
        } else pending = null;
      }
    }

    function goToPage(num) {
      if (num < 1 || num > totalPages || num === currentPage) return;
      currentPage = num;
      renderPage(currentPage);
    }
    const nextPage = () => goToPage(currentPage + 1);
    const prevPage = () => goToPage(currentPage - 1);

    // ---------- Init ----------
    async function init() {
      try {
        loader.classList.add('active');
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdfDoc.numPages;

        wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.innerHTML = '<canvas></canvas><div class="annotation-layer"></div>';
        viewer.appendChild(wrapper);

        await renderPage(1);

        // Show controls (both desktop bar and mobile buttons)
        controls.classList.add('visible');
        document.querySelectorAll('.m-btn').forEach(b => b.classList.add('visible'));

        // Desktop keyboard hint
        setTimeout(() => hint.classList.add('visible'), 600);
        setTimeout(() => hint.classList.remove('visible'), 4500);
      } catch (err) {
        console.error('Error loading PDF:', err);
        loader.classList.remove('active');
        errorEl.classList.add('active');
      }
    }

    // ---------- Event bindings ----------
    // Use class selectors so desktop AND mobile buttons get the same handlers
    document.querySelectorAll('.btn-prev').forEach(b => b.addEventListener('click', prevPage));
    document.querySelectorAll('.btn-next').forEach(b => b.addEventListener('click', nextPage));
    document.querySelectorAll('.btn-fullscreen').forEach(b => b.addEventListener('click', toggleFs));

    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      switch (e.key) {
        case 'ArrowRight': case 'PageDown': case ' ':
          e.preventDefault(); nextPage(); break;
        case 'ArrowLeft': case 'PageUp':
          e.preventDefault(); prevPage(); break;
        case 'Home':
          e.preventDefault(); goToPage(1); break;
        case 'End':
          e.preventDefault(); goToPage(totalPages); break;
        case 'f': case 'F':
          toggleFs(); break;
      }
    });

    // Wheel (desktop only — passive scroll-to-change-page)
    let wheelAccum = 0, wheelTimer = null, wheelCD = false;
    document.addEventListener('wheel', (e) => {
      if (wheelCD) return;
      wheelAccum += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAccum = 0; }, 120);
      if (Math.abs(wheelAccum) > 80) {
        if (wheelAccum > 0) nextPage(); else prevPage();
        wheelAccum = 0;
        wheelCD = true;
        setTimeout(() => { wheelCD = false; }, 350);
      }
    }, { passive: true });

    // Re-render on resize / orientation change
    let resizeTimer;
    function handleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (pdfDoc && wrapper) renderPage(currentPage);
      }, 180);
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    // Idle controls (auto-dim after 3s of inactivity)
    let idleTimer;
    function wake() {
      controls.classList.remove('idle');
      document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('idle'));
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        controls.classList.add('idle');
        document.querySelectorAll('.m-btn').forEach(b => b.classList.add('idle'));
      }, 3000);
    }
    ['mousemove', 'touchstart', 'keydown'].forEach(ev =>
      document.addEventListener(ev, wake, { passive: true })
    );
    wake();

    init();
  </script>
</body>
</html>
