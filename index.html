<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portafolio Diana Ramírez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Portafolio de Diana Ramírez — Realizador Cinematográfico y Audiovisual">
  <meta name="theme-color" content="#000000">

  <!-- FAVICONS -->
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: rgba(255, 255, 255, 0.55);
      --control-bg: rgba(18, 18, 18, 0.78);
      --control-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- DESKTOP MODE (slide presentation) ---------- */
    body.desktop-mode {
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    body.desktop-mode html { height: 100%; }

    body.desktop-mode::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
      z-index: 2;
    }

    body.desktop-mode #viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    body.desktop-mode .page-wrapper {
      position: relative;
      box-shadow: var(--shadow);
      transition: opacity 0.25s ease;
    }
    body.desktop-mode .page-wrapper.swapping { opacity: 0; }

    /* ---------- MOBILE MODE (vertical scroll) ---------- */
    body.mobile-mode {
      min-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body.mobile-mode #viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 24px;
      gap: 8px;
      width: 100%;
    }

    body.mobile-mode .page-wrapper {
      position: relative;
      max-width: 100%;
      background: #0a0a0a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* ---------- COMMON: canvas + annotation layer ---------- */
    .page-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .annotation-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* solo los <a> hijos reciben clics */
    }

    .pdf-link {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.15);
    }
    @media (hover: hover) {
      .pdf-link:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
      }
    }

    /* ---------- Loader ---------- */
    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--fg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    #loader.active { opacity: 1; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* ---------- Desktop controls bar ---------- */
    #controls {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translate(-50%, 8px);
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--control-bg);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 6px;
      z-index: 30;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #controls.visible { opacity: 1; transform: translate(-50%, 0); }
    #controls.idle { opacity: 0.15; }
    #controls.idle:hover { opacity: 1; }

    body.mobile-mode #controls { display: none; }

    .btn {
      background: transparent;
      border: none;
      color: var(--fg);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, transform 0.18s ease;
      padding: 0;
      text-decoration: none;
    }
    .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
    .btn:active:not(:disabled) { transform: scale(0.92); }
    .btn:disabled { opacity: 0.25; cursor: default; }
    .btn svg { width: 18px; height: 18px; pointer-events: none; }

    .separator {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 4px;
    }

    #page-info {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 0 14px;
      min-width: 64px;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #page-info .current { color: var(--fg); }

    /* ---------- Mobile floating download ---------- */
    #mobile-dl {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--control-bg);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--control-border);
      color: var(--fg);
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    #mobile-dl svg { width: 18px; height: 18px; }
    body.mobile-mode #mobile-dl { display: flex; }

    /* ---------- Hint ---------- */
    #hint {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 29;
      white-space: nowrap;
    }
    #hint.visible { opacity: 1; }
    body.mobile-mode #hint { display: none; }

    /* ---------- Error ---------- */
    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 24px;
      display: none;
      z-index: 60;
    }
    #error.active { display: block; }
    #error p { margin: 8px 0; color: var(--muted); }
    #error a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--control-border);
      border-radius: 999px;
      transition: background 0.2s;
    }
    #error a:hover { background: rgba(255, 255, 255, 0.08); }
  </style>
</head>

<body>
  <div id="viewer"></div>

  <div id="loader"></div>

  <div id="error">
    <p>No se pudo cargar el portafolio.</p>
    <a href="portafolio-diana-ramirez.pdf" download>Descargar PDF</a>
  </div>

  <div id="hint">← →   navegar   ·   F   pantalla completa</div>

  <!-- Desktop controls (hidden on mobile) -->
  <div id="controls" role="toolbar" aria-label="Controles">
    <button class="btn" id="prev-btn" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="page-info"><span class="current">—</span> / —</span>
    <button class="btn" id="next-btn" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <span class="separator"></span>
    <button class="btn" id="fullscreen-btn" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
    <a class="btn" id="download-btn" href="portafolio-diana-ramirez.pdf" download aria-label="Descargar PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </a>
  </div>

  <!-- Mobile floating download -->
  <a id="mobile-dl" href="portafolio-diana-ramirez.pdf" download aria-label="Descargar PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = 'portafolio-diana-ramirez.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Detect mobile / touch — decided once on load
    const isMobile = window.matchMedia('(max-width: 900px), (pointer: coarse)').matches;
    document.body.classList.add(isMobile ? 'mobile-mode' : 'desktop-mode');

    const viewer = document.getElementById('viewer');
    const loader = document.getElementById('loader');
    const errorEl = document.getElementById('error');
    const controls = document.getElementById('controls');
    const hint = document.getElementById('hint');
    const pageInfo = document.getElementById('page-info');
    const currentEl = pageInfo.querySelector('.current');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const fsBtn = document.getElementById('fullscreen-btn');

    let pdfDoc = null;
    let totalPages = 0;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

    // ---------- Annotation rendering (shared) ----------
    async function renderAnnotations(page, displayViewport, layerEl) {
      layerEl.innerHTML = '';
      const annotations = await page.getAnnotations();

      for (const ann of annotations) {
        if (ann.subtype !== 'Link') continue;

        const a = document.createElement('a');
        a.className = 'pdf-link';

        // External URL
        if (ann.url) {
          a.href = ann.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        // Internal destination (link to another page within the PDF)
        else if (ann.dest) {
          a.href = '#';
          a.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
              const dest = typeof ann.dest === 'string'
                ? await pdfDoc.getDestination(ann.dest)
                : ann.dest;
              if (dest && dest[0]) {
                const pageIndex = await pdfDoc.getPageIndex(dest[0]);
                if (typeof goToPage === 'function') goToPage(pageIndex + 1);
                else {
                  // mobile: scroll to that page
                  const target = document.querySelector(`.page-wrapper[data-page="${pageIndex + 1}"]`);
                  target?.scrollIntoView({ behavior: 'smooth' });
                }
              }
            } catch (err) { console.error(err); }
          });
        } else {
          continue;
        }

        // Convert PDF coords to viewport coords
        const r = pdfjsLib.Util.normalizeRect(
          displayViewport.convertToViewportRectangle(ann.rect)
        );
        const left = r[0];
        const top = r[1];
        const width = r[2] - r[0];
        const height = r[3] - r[1];

        // Express as percentages so they stay aligned if the wrapper resizes
        a.style.left = (left / displayViewport.width * 100) + '%';
        a.style.top = (top / displayViewport.height * 100) + '%';
        a.style.width = (width / displayViewport.width * 100) + '%';
        a.style.height = (height / displayViewport.height * 100) + '%';

        layerEl.appendChild(a);
      }
    }

    // ---------- Render a single page into its wrapper ----------
    async function renderPageInto(pageNum, wrapper, fitMode) {
      const page = await pdfDoc.getPage(pageNum);
      const canvas = wrapper.querySelector('canvas');
      const annLayer = wrapper.querySelector('.annotation-layer');
      const ctx = canvas.getContext('2d', { alpha: false });

      const baseViewport = page.getViewport({ scale: 1 });

      let displayWidth, displayHeight;
      if (fitMode === 'width') {
        // Mobile: fit container width
        const containerW = viewer.clientWidth || window.innerWidth;
        displayWidth = Math.min(containerW, baseViewport.width * 1.5); // cap at 1.5x to avoid huge canvases
        displayHeight = (baseViewport.height / baseViewport.width) * displayWidth;
      } else {
        // Desktop: fit both dimensions
        const padding = 32;
        const availW = window.innerWidth - padding * 2;
        const availH = window.innerHeight - padding * 2;
        const scale = Math.min(availW / baseViewport.width, availH / baseViewport.height);
        displayWidth = baseViewport.width * scale;
        displayHeight = baseViewport.height * scale;
      }

      const dispScale = displayWidth / baseViewport.width;
      const displayViewport = page.getViewport({ scale: dispScale });
      const renderViewport = page.getViewport({ scale: dispScale * DPR });

      canvas.width = renderViewport.width;
      canvas.height = renderViewport.height;
      canvas.style.width = displayWidth + 'px';
      canvas.style.height = displayHeight + 'px';

      wrapper.style.width = displayWidth + 'px';
      wrapper.style.height = displayHeight + 'px';

      // Cancel any in-flight render on this wrapper
      if (wrapper._renderTask) {
        try { wrapper._renderTask.cancel(); } catch (e) {}
      }
      wrapper._renderTask = page.render({ canvasContext: ctx, viewport: renderViewport });

      try {
        await wrapper._renderTask.promise;
        await renderAnnotations(page, displayViewport, annLayer);
      } catch (err) {
        if (err?.name !== 'RenderingCancelledException') throw err;
      } finally {
        wrapper._renderTask = null;
      }
    }

    // ============================================================
    //   DESKTOP MODE  (single page slide)
    // ============================================================
    let currentPage = 1;
    let goToPage = null;

    async function setupDesktop() {
      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      wrapper.innerHTML = '<canvas></canvas><div class="annotation-layer"></div>';
      viewer.appendChild(wrapper);

      let rendering = false;
      let pending = null;

      async function render(num) {
        if (rendering) { pending = num; return; }
        rendering = true;
        loader.classList.add('active');
        wrapper.classList.add('swapping');

        try {
          await renderPageInto(num, wrapper, 'contain');
          await new Promise(r => requestAnimationFrame(r));
          wrapper.classList.remove('swapping');
          currentEl.textContent = num;
          pageInfo.lastChild.textContent = ' / ' + totalPages;
          prevBtn.disabled = num <= 1;
          nextBtn.disabled = num >= totalPages;
        } finally {
          rendering = false;
          loader.classList.remove('active');
          if (pending !== null && pending !== num) {
            const next = pending; pending = null;
            render(next);
          } else {
            pending = null;
          }
        }
      }

      goToPage = (num) => {
        if (num < 1 || num > totalPages || num === currentPage) return;
        currentPage = num;
        render(currentPage);
      };
      const nextPage = () => goToPage(currentPage + 1);
      const prevPage = () => goToPage(currentPage - 1);

      await render(1);
      controls.classList.add('visible');

      // First-load hint
      setTimeout(() => hint.classList.add('visible'), 600);
      setTimeout(() => hint.classList.remove('visible'), 4500);

      // Buttons
      prevBtn.addEventListener('click', prevPage);
      nextBtn.addEventListener('click', nextPage);
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
        else document.exitFullscreen?.();
      });

      // Keyboard
      document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        switch (e.key) {
          case 'ArrowRight': case 'PageDown': case ' ':
            e.preventDefault(); nextPage(); break;
          case 'ArrowLeft': case 'PageUp':
            e.preventDefault(); prevPage(); break;
          case 'Home':
            e.preventDefault(); goToPage(1); break;
          case 'End':
            e.preventDefault(); goToPage(totalPages); break;
          case 'f': case 'F':
            fsBtn.click(); break;
        }
      });

      // Wheel (debounced) — counts as intentional, doesn't conflict with link clicks
      let wheelAccum = 0, wheelTimer = null, wheelCD = false;
      document.addEventListener('wheel', (e) => {
        if (wheelCD) return;
        wheelAccum += e.deltaY;
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => { wheelAccum = 0; }, 120);
        if (Math.abs(wheelAccum) > 80) {
          if (wheelAccum > 0) nextPage(); else prevPage();
          wheelAccum = 0;
          wheelCD = true;
          setTimeout(() => { wheelCD = false; }, 350);
        }
      }, { passive: true });

      // Resize → re-render
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => render(currentPage), 180);
      });

      // Idle controls
      let idleTimer;
      function wake() {
        controls.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => controls.classList.add('idle'), 3000);
      }
      ['mousemove', 'keydown'].forEach(ev =>
        document.addEventListener(ev, wake, { passive: true })
      );
      wake();
    }

    // ============================================================
    //   MOBILE MODE  (all pages stacked, lazy-rendered)
    // ============================================================
    async function setupMobile() {
      // Get page-1 dimensions to set placeholder aspect ratio
      const firstPage = await pdfDoc.getPage(1);
      const v = firstPage.getViewport({ scale: 1 });
      const aspect = v.width / v.height;

      const containerW = viewer.clientWidth || window.innerWidth;
      const placeholderW = Math.min(containerW, v.width * 1.5);
      const placeholderH = placeholderW / aspect;

      // Create placeholders for all pages
      for (let i = 1; i <= totalPages; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.dataset.page = i;
        wrapper.style.width = placeholderW + 'px';
        wrapper.style.height = placeholderH + 'px';
        wrapper.innerHTML = '<canvas></canvas><div class="annotation-layer"></div>';
        viewer.appendChild(wrapper);
      }

      loader.classList.remove('active');

      // Lazy render with IntersectionObserver
      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting && !entry.target.dataset.rendered) {
            const w = entry.target;
            w.dataset.rendered = 'pending';
            renderPageInto(parseInt(w.dataset.page), w, 'width')
              .then(() => { w.dataset.rendered = 'done'; })
              .catch((err) => {
                console.error(err);
                w.dataset.rendered = ''; // allow retry
              });
          }
        }
      }, { rootMargin: '600px 0px' });

      viewer.querySelectorAll('.page-wrapper').forEach(w => observer.observe(w));

      // Re-render on resize/orientation change
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          // Recompute placeholder dimensions and re-render
          const newW = Math.min(viewer.clientWidth || window.innerWidth, v.width * 1.5);
          const newH = newW / aspect;
          viewer.querySelectorAll('.page-wrapper').forEach(w => {
            if (w.dataset.rendered === 'done') {
              w.dataset.rendered = '';
              renderPageInto(parseInt(w.dataset.page), w, 'width')
                .then(() => { w.dataset.rendered = 'done'; });
            } else if (!w.dataset.rendered) {
              w.style.width = newW + 'px';
              w.style.height = newH + 'px';
            }
          });
        }, 250);
      });
    }

    // ============================================================
    //   INIT
    // ============================================================
    async function init() {
      try {
        loader.classList.add('active');
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdfDoc.numPages;

        if (isMobile) await setupMobile();
        else await setupDesktop();
      } catch (err) {
        console.error('Error loading PDF:', err);
        loader.classList.remove('active');
        errorEl.classList.add('active');
      }
    }

    init();
  </script>
</body>
</html>
